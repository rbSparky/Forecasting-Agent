name: CF Proteins Typed

on:
  push:
    branches: [cf-closure-lab-20260806]
    paths:
      - 'cf_closure/proteins_typed_cf.py'
      - '.github/workflows/cf-proteins-typed.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cf_closure/proteins_typed_cf.py'
      - '.github/workflows/cf-proteins-typed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typed:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy scikit-learn ogb
      - name: Run typed edge-channel closed-form experiment
        env:
          PYTHONUNBUFFERED: '1'
          OMP_NUM_THREADS: '4'
          OPENBLAS_NUM_THREADS: '4'
          MKL_NUM_THREADS: '4'
        run: python cf_closure/proteins_typed_cf.py
      - name: Upload reports and scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-proteins-typed-results
          compression-level: 1
          path: |
            cf_closure/_results/proteins_typed_cf.json
            cf_closure/_results/proteins_typed_scores.npy
