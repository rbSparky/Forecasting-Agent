name: Temporary CF public-data bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'tmp_cf_bridge.py'
      - '.github/workflows/tmp-cf-data-bridge.yml'

permissions:
  contents: write

jobs:
  bridge:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and encode public datasets
        run: python tmp_cf_bridge.py
      - name: Commit bridge output to temporary branch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'cfbenchmark-runner'
          git config user.email 'cfbenchmark-runner@users.noreply.github.com'
          git add tmp_cf_data
          if git diff --cached --quiet; then
            echo 'No bridge changes.'
            exit 0
          fi
          git commit -m 'Add public benchmark bridge chunks [skip ci]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
