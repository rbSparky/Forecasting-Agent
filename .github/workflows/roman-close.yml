name: Locked Roman-empire closure experiment

on:
  push:
    branches:
      - tmp/roman-close-20260806
    paths:
      - 'roman_close/**'
      - '.github/workflows/roman-close.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'roman_close/**'
      - '.github/workflows/roman-close.yml'

permissions:
  contents: read

jobs:
  roman-close:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install frozen parsers and numerical stack
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn requests 'spacy==3.8.11' 'spacy-transformers>=1.3.9'
          python -m pip install 'https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl'
          python -m pip install 'https://github.com/explosion/spacy-models/releases/download/en_core_web_hftrf-3.8.1/en_core_web_hftrf-3.8.1-py3-none-any.whl'
      - name: Run exact-source ten-split evaluation
        working-directory: roman_close
        shell: bash
        run: |
          set -o pipefail
          python experiment_roman_source.py | tee roman_close.log
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roman-close-evidence
          path: |
            roman_close/roman_close.log
            roman_close/out/**
          if-no-files-found: warn
          retention-days: 14
