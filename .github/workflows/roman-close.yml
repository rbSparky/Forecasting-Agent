name: Locked Roman-empire closure experiment

on:
  push:
    branches:
      - tmp/roman-close-20260806
    paths:
      - 'roman_close/**'
      - '.github/workflows/roman-close.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'roman_close/**'
      - '.github/workflows/roman-close.yml'

permissions:
  contents: read

jobs:
  roman-close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed compact parser and evaluator
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn requests click 'spacy==3.8.11'
          python -m pip install 'https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl'
      - name: Run strict locked ten-split evaluation
        working-directory: roman_close
        shell: bash
        run: |
          set -o pipefail
          python strict_fsp.py | tee strict_fsp.log
      - name: Upload strict evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roman-fsp-anonymous-evidence
          path: |
            roman_close/strict_fsp.log
            roman_close/anonymous_out/**
            roman_close/strict_fsp.py
          if-no-files-found: error
          retention-days: 30
