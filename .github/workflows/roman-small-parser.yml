name: Roman lightweight parser projection

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/roman-small-parser.yml'

permissions:
  contents: read

jobs:
  small-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROMAN_SPACY_MODEL: en_core_web_sm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install lightweight parser
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade 'pip<25'
          python -m pip install 'numpy==1.24.4' 'requests<3' 'click<8.2' 'pydantic<2' 'spacy==3.6.1'
          python -m pip install 'https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.6.0/en_core_web_sm-3.6.0-py3-none-any.whl'
      - name: Evaluate all official splits
        working-directory: experiments/roman_closed_form
        shell: bash
        run: |
          set -o pipefail
          python roman_source_projection.py | tee roman_small_projection.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roman-small-parser-projection
          path: |
            experiments/roman_closed_form/roman_small_projection.log
            experiments/roman_closed_form/out/**
          if-no-files-found: warn
          retention-days: 14
