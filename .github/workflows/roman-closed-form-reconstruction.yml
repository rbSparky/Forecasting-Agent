name: Roman closed-form reconstruction

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/roman_closed_form/**'
      - '.github/workflows/roman-closed-form-reconstruction.yml'

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ROMAN_SPACY_MODEL: en_core_web_trf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install exact 2022 parser stack
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade 'pip<25' wheel
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.0.1+cpu'
          python -m pip install \
            'numpy==1.24.4' \
            'requests<3' \
            'click<8.2' \
            'pydantic<2' \
            'spacy==3.6.1' \
            'spacy-transformers==1.2.5' \
            'transformers==4.30.2'
          python -m pip install 'https://github.com/explosion/spacy-models/releases/download/en_core_web_trf-3.6.1/en_core_web_trf-3.6.1-py3-none-any.whl'
          python - <<'PY'
          import importlib.metadata, torch, spacy
          print('torch', torch.__version__)
          print('spacy', spacy.__version__)
          print('spacy-transformers', importlib.metadata.version('spacy-transformers'))
          print('transformers', importlib.metadata.version('transformers'))
          print('model', importlib.metadata.version('en-core-web-trf'))
          PY
      - name: Reconstruct and evaluate all official splits
        working-directory: experiments/roman_closed_form
        shell: bash
        run: |
          set -o pipefail
          python roman_source_projection.py | tee roman_source_projection.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roman-closed-form-reconstruction
          path: |
            experiments/roman_closed_form/roman_source_projection.log
            experiments/roman_closed_form/out/**
          if-no-files-found: warn
          retention-days: 14
