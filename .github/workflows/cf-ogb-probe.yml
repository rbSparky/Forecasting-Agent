name: CF OGB Probe

on:
  push:
    branches: [cf-closure-lab-20260806]
    paths:
      - 'cf_closure/ogb_probe.py'
      - '.github/workflows/cf-ogb-probe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cf_closure/ogb_probe.py'
      - '.github/workflows/cf-ogb-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        dataset: [ogbn-arxiv, ogbn-proteins]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy pandas scikit-learn ogb
      - name: Probe official dataset
        env:
          PYTHONUNBUFFERED: '1'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: python cf_closure/ogb_probe.py --dataset ${{ matrix.dataset }}
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: cf-${{ matrix.dataset }}-probe
          path: cf_closure/_results/${{ matrix.dataset }}-probe.json
